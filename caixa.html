<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lds Barber - Caixa Diário</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #121214; color: #e1e1e6; margin: 0; padding: 0; }
        .main-content { padding: 80px 30px 30px 30px; }
        
        .caixa-resumo { display: flex; gap: 20px; margin-bottom: 30px; }
        .card { background: #202024; padding: 20px; border-radius: 8px; flex: 1; border: 1px solid #323238; text-align: center; }
        .card h3 { color: #a8a8a8; font-size: 14px; margin: 0; }
        .card p { font-size: 28px; color: #00b37e; font-weight: bold; margin: 10px 0 0; }
        
        .tabela-caixa { width: 100%; border-collapse: collapse; background: #202024; border: 1px solid #323238; }
        .tabela-caixa th { background-color: #29292e; color: #ff9000; padding: 12px; text-align: left; }
        .tabela-caixa td { padding: 12px; border-bottom: 1px solid #29292e; }
        
        .tag-categoria { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: #323238; color: #ff9000; text-transform: uppercase; }
    </style>
</head>
<body>

    <div id="menu-container"></div>

    <div class="main-content">
        <h1>💰 Controle de Caixa Diário</h1>
        
        <div class="caixa-resumo">
            <div class="card"><h3>Total de Vendas</h3><p id="totalVendas">R$ 0,00</p></div>
            <div class="card"><h3>Qtd. de Vendas</h3><p id="qtdVendas">0</p></div>
        </div>

        <table class="tabela-caixa">
            <thead>
                <tr><th>Categoria</th><th>Produto/Serviço</th><th>Valor</th><th>Data</th></tr>
            </thead>
            <tbody id="corpoTabelaCaixa">
                <tr><td colspan="4">Carregando dados...</td></tr>
            </tbody>
        </table>
    </div>

    <script src="firebase-init.js"></script>
    <script src="config-global.js"></script>
    <script src="auth-controle.js"></script>
    <script src="menu.js"></script>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let idLoja = urlParams.get('id') || localStorage.getItem("idLojaAtual");
        if (idLoja) localStorage.setItem("idLojaAtual", idLoja);

        window.onload = () => {
            if (!idLoja) return;

            window.db.collection("historico_vendas")
                .where("estabelecimentoId", "==", idLoja)
                .onSnapshot(snap => {
                    let total = 0;
                    let listaHtml = "";

                    snap.forEach(doc => {
                        const v = doc.data();
                        
                        let valorRaw = v.valorTotal || v.valor || 0;
                        let valorNumerico = parseFloat(valorRaw);
                        if (isNaN(valorNumerico)) valorNumerico = 0;
                        total += valorNumerico;

                        let categoria = v.categoria || v.tipo || "Geral";
                        
                        listaHtml += `<tr>
                            <td><span class="tag-categoria">${categoria}</span></td>
                            <td>${v.nomeProduto || 'Venda'}</td>
                            <td>R$ ${valorNumerico.toFixed(2)}</td>
                            <td>${v.timestamp ? new Date(v.timestamp.toDate()).toLocaleDateString() : '-'}</td>
                        </tr>`;
                    });

                    document.getElementById("totalVendas").innerText = `R$ ${total.toFixed(2)}`;
                    document.getElementById("qtdVendas").innerText = snap.size;
                    document.getElementById("corpoTabelaCaixa").innerHTML = listaHtml || "<tr><td colspan='4'>Nenhuma venda encontrada.</td></tr>";
                });
        };
    </script>
</body>
</html>
