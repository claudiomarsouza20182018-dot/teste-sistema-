<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Painel de Agendamentos</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #121214; color: #e1e1e6; margin: 0; padding-bottom: 80px; font-size: 14px; }
        .main-content { padding: 80px 15px 15px 15px; width: 100%; box-sizing: border-box; }
        .content-wrapper { width: 100%; max-width: 900px; margin: 0 auto; }
        .header-top { display: flex; gap: 10px; margin-bottom: 15px; }
        #seletorProfissional { background: #202024; color: #ff9000; border: 1px solid #ff9000; padding: 10px; border-radius: 8px; font-weight: bold; width: 60%; }
        .btn-link { background:#ff9100; color:#121214; border:none; padding:10px; width: 40%; border-radius:8px; cursor:pointer; font-weight:bold; }
        .container-resumo { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 20px 0; background: #202024; padding: 15px; border-radius: 12px; border: 1px solid #323238; }
        .item-resumo { text-align: center; }
        .item-resumo div:first-child { font-size: 1.2em; font-weight: bold; color: #fff; }
        .item-resumo div:last-child { font-size: 0.8em; color: #888; margin-top: 5px; }
        .carrossel-dias { display: flex; gap: 8px; overflow-x: auto; padding: 5px 0; margin-bottom: 15px; }
        .card-dia { background: #202024; padding: 10px; border-radius: 8px; min-width: 50px; text-align: center; border: 1px solid #323238; cursor: pointer; }
        .card-dia.active { border-color: #ff9000; background: #ff9000; color: #121214; }
        #listaAgendamentos { position: relative; height: 1300px; border-top: 1px solid #323238; margin-top: 20px; }
        .linha-hora { position: absolute; width: 100%; border-bottom: 1px solid #323238; height: 100px; }
        .label-hora { color: #666; font-size: 12px; font-weight: bold; padding: 5px; }
        
        /* CARD OTIMIZADO PARA SERVIÇOS CURTOS */
        .card-agendamento { 
            position: absolute; 
            left: 60px; 
            right: 10px; 
            background: #202024; 
            border-left: 3px solid #ff9000; 
            padding: 0 4px; 
            border-radius: 2px; 
            display: flex; 
            flex-direction: row; 
            align-items: center; 
            justify-content: space-between;
            z-index: 2; 
            box-shadow: 0 1px 2px rgba(0,0,0,0.4); 
            font-size: 8px; 
            overflow: hidden;
            min-height: 8px; /* Permite cards de 5min sem sobreposição */
        }
        
        .info-agendamento {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-grow: 1;
            margin-right: 4px;
        }

        .botoes-container { display: flex; gap: 1px; }
        .btn-acao { border: none; padding: 1px 3px; border-radius: 2px; cursor: pointer; font-size: 7px; font-weight: bold; }
        .btn-atendido { background: #28a745; color: white; }
        .btn-cancelar { background: #dc3545; color: white; }
        .btn-alerta { background: #f1c40f; color: black; }
        .btn-nav { background: #29292e; color: #ff9100; border: 1px solid #ff8800; padding: 10px 20px; cursor: pointer; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="menu-container"></div>
    <div class="main-content">
        <div class="content-wrapper">
            <div class="header-top">
                <select id="seletorProfissional" onchange="renderizarAgendaAtual()">
                    <option value="todos">Profissionais</option>
                </select>
                <button class="btn-link" onclick="copiarLink()">Copiar Link 📋</button>
            </div>
            <div class="container-resumo">
                <div class="item-resumo"><div id="count-total">0</div><div>Total</div></div>
                <div class="item-resumo"><div id="count-atendidos" style="color:#28a745">0</div><div>Atendidos</div></div>
                <div class="item-resumo"><div id="count-pendentes" style="color:#ff9000">0</div><div>Pendentes</div></div>
                <div class="item-resumo"><div id="count-cancelados" style="color:#dc3545">0</div><div>Cancelados</div></div>
            </div>
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px;">
                <button class="btn-nav" onclick="mudarSemana(-1)">◀</button>
                <span id="mesAnoDisplay" style="font-weight:bold; font-size: 16px;">---</span>
                <button class="btn-nav" onclick="mudarSemana(1)">▶</button>
            </div>
            <div class="carrossel-dias" id="carrosselDatas"></div>
            <div id="listaAgendamentos"></div>
        </div>
    </div>

    <script src="firebase-init.js"></script>
    <script src="config-global.js"></script>
    <script src="auth-controle.js"></script>
    <script src="menu.js"></script>
    
    <script>
        let dataBase = new Date();
        let dataSelecionada = new Date();
        const PIXELS_POR_HORA = 100;

        firebase.auth().onAuthStateChanged((user) => {
            if (user) {
                const idLoja = obterIdComercio();
                carregarProfissionais(idLoja);
                renderizarCarrossel();
                setTimeout(() => selecionarDiaHoje(), 500);
            }
        });

        async function carregarAgendaDia(dataObj, idLoja) {
            if (!idLoja) return;
            renderizarLinhasDeFundo();
            const container = document.getElementById("listaAgendamentos");
            const dataFormatada = dataObj.toLocaleDateString('pt-BR');
            const prof = document.getElementById("seletorProfissional").value;
            
            const snap = await firebase.firestore().collection("agenda_clientes")
                .where("estabelecimentoId", "==", idLoja)
                .where("dataFormatada", "==", dataFormatada).get();

            snap.forEach(doc => {
                const d = doc.data();
                if (prof !== "todos" && d.profissional !== prof) return;

                const [h, m] = d.horario.split(':').map(Number);
                const topPos = ((h - 8) * PIXELS_POR_HORA) + ((m / 60) * PIXELS_POR_HORA);
                
                const duracao = parseInt(d.duracaoMinutos) || 30; 
                const alturaProporcional = (duracao / 60) * PIXELS_POR_HORA;
                // Mínimo 8px garante que serviços de 5min não sobreponham outros
                const alturaFinal = Math.max(alturaProporcional, 8); 

                const card = document.createElement('div');
                card.className = 'card-agendamento';
                card.style.top = topPos + 'px';
                card.style.height = alturaFinal + 'px';

                card.innerHTML = `
                    <div class="info-agendamento"><strong>${d.cliente}</strong> | ${d.servico}</div>
                    <div class="botoes-container">
                        <button class="btn-acao btn-alerta" onclick="alert('Notificar: ${d.cliente}')">🔔</button>
                        <button class="btn-acao btn-atendido" onclick="atualizarStatus('${doc.id}', 'Atendido')">✔</button>
                        <button class="btn-acao btn-cancelar" onclick="atualizarStatus('${doc.id}', 'Cancelado')">✖</button>
                    </div>`;
                container.appendChild(card);
            });
            recalcularResumo();
        }

        async function atualizarStatus(id, novoStatus) {
            await firebase.firestore().collection("agenda_clientes").doc(id).update({ status: novoStatus });
            carregarAgendaDia(dataSelecionada, obterIdComercio());
        }

        function recalcularResumo() {
            const cards = document.querySelectorAll('.card-agendamento');
            document.getElementById('count-total').innerText = cards.length;
        }

        function renderizarLinhasDeFundo() {
            const container = document.getElementById("listaAgendamentos");
            container.innerHTML = "";
            for (let h = 8; h <= 20; h++) {
                const divHora = document.createElement('div');
                divHora.className = 'linha-hora';
                divHora.style.top = ((h - 8) * PIXELS_POR_HORA) + 'px';
                divHora.innerHTML = `<div class="label-hora">${h.toString().padStart(2, '0')}:00</div>`;
                container.appendChild(divHora);
            }
        }

        function renderizarCarrossel() {
            const container = document.getElementById('carrosselDatas');
            container.innerHTML = "";
            let temp = new Date(dataBase);
            temp.setDate(temp.getDate() - (temp.getDay() === 0 ? 6 : temp.getDay() - 1));
            document.getElementById('mesAnoDisplay').innerText = temp.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
            for (let i = 0; i < 7; i++) {
                let dia = new Date(temp); dia.setDate(temp.getDate() + i);
                const div = document.createElement('div');
                div.className = 'card-dia';
                div.innerHTML = `<small>${dia.toLocaleDateString('pt-BR', { weekday: 'short' })}</small><br><strong>${dia.getDate()}</strong>`;
                div.onclick = () => {
                    document.querySelectorAll('.card-dia').forEach(c => c.classList.remove('active'));
                    div.classList.add('active');
                    dataSelecionada = dia;
                    carregarAgendaDia(dia, obterIdComercio());
                };
                container.appendChild(div);
            }
        }

        function carregarProfissionais(idLoja) {
            firebase.firestore().collection("config_profissionais").where("estabelecimentoId", "==", idLoja).onSnapshot(snap => {
                const select = document.getElementById("seletorProfissional");
                select.innerHTML = '<option value="todos">Todos</option>';
                snap.forEach(doc => { select.innerHTML += `<option value="${doc.data().nome}">${doc.data().nome}</option>`; });
            });
        }

        function copiarLink() {
            const user = firebase.auth().currentUser;
            const link = `${window.location.origin}/agendar.html?id=${user.uid}`;
            navigator.clipboard.writeText(link).then(() => alert("Link copiado!"));
        }

        function selecionarDiaHoje() {
            const hoje = new Date().getDate();
            document.querySelectorAll('.card-dia').forEach(card => { if (card.querySelector('strong').innerText == hoje) card.click(); });
        }

        function renderizarAgendaAtual() { carregarAgendaDia(dataSelecionada, obterIdComercio()); }
        function mudarSemana(offset) { dataBase.setDate(dataBase.getDate() + (offset * 7)); renderizarCarrossel(); }
    </script>
</body>
</html>
