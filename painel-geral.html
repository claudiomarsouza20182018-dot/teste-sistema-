<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel de Agendamentos</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #121214; color: #e1e1e6; margin: 0; display: flex; }
        .nav-sidebar { width: 170px; background-color: #202024; border-right: 1px solid #323238; display: flex; flex-direction: column; padding: 20px 10px; height: 100vh; position: fixed; box-sizing: border-box; }
        .sidebar-titulo { color: #a8a8a8; font-size: 12px; font-weight: bold; padding-left: 10px; margin-bottom: 15px; text-transform: uppercase; }
        .nav-sidebar a { color: #ff9000; text-decoration: none; font-weight: bold; font-size: 12px; padding: 12px 10px; margin-bottom: 8px; border-radius: 5px; transition: background 0.2s; }
        .nav-sidebar a:hover { background-color: #2d2d34; }
        .nav-sidebar a.active { color: #fff; background-color: #ff9000; }
        
        .main-content { margin-left: 170px; padding: 30px; width: 100%; }
        header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 1px solid #323238; margin-bottom: 30px; }
        
        .seletor-semana { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 20px; }
        .btn-nav { background: #29292e; color: #ff9000; border: 1px solid #ff9000; padding: 8px 15px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .carrossel-dias { display: flex; gap: 10px; overflow-x: auto; padding: 10px 0; justify-content: center; }
        .card-dia { background: #202024; padding: 15px; border-radius: 8px; min-width: 70px; text-align: center; cursor: pointer; border: 1px solid #323238; transition: 0.2s; }
        .card-dia:hover { border-color: #ff9000; }
        .card-dia.active { border-color: #ff9000; background: #ff9000; color: #121214; }
        
        .tabela-agenda { width: 100%; border-collapse: collapse; background: #202024; border-radius: 8px; overflow: hidden; margin-top: 20px; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #323238; }
        th { background-color: #29292e; color: #ff9000; }
        .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; background: #ff9000; color: #121214; font-weight: bold; }
    </style>
</head>
<body>

    <div class="nav-sidebar">
        <span class="sidebar-titulo"></span>
        <a href="#" id="linkAgenda">📅 Agenda</a>
        <a href="#" id="linkCaixa">💰 Caixa Diário</a>
        <a href="#" id="linkVendas">Registrar Venda</a>
        <a href="#" id="linkEstoque">Ver Estoque</a>
        <a href="#" id="linkCadastro">Cadastrar/Entrada</a>
        <a href="#" id="linkFaturamento">Faturamento</a>
        <a href="#" id="linkConfig">⚙️ Configurações</a>
    </div>

    <div class="main-content">
        <header>
            <h1>Painel de Agendamentos</h1>
            <div>
                <button onclick="copiarLink()" style="background:#ff9000; color:#121214; border:none; padding:8px 12px; border-radius:4px; cursor:pointer; font-weight:bold; margin-right: 10px;">
                    Link de Agendamento
                </button>
                <button onclick="fazerLogout()" style="background:#f74040; color:white; border:none; padding:8px; border-radius:4px; cursor:pointer;">Sair</button>
            </div>
        </header>

        <div class="seletor-semana">
            <button class="btn-nav" onclick="mudarSemana(-1)">◀</button>
            <span id="mesAnoDisplay" style="font-weight:bold; font-size: 18px;">---</span>
            <button class="btn-nav" onclick="mudarSemana(1)">▶</button>
        </div>

        <div class="carrossel-dias" id="carrosselDatas"></div>

        <table class="tabela-agenda">
            <thead>
                <tr><th>Cliente</th><th>Horário</th><th>Serviço</th><th>Valor</th><th>Status</th></tr>
            </thead>
            <tbody id="listaAgendamentos">
                <tr><td colspan="5">Selecione uma data acima.</td></tr>
            </tbody>
        </table>
    </div>

    <script src="firebase-init.js"></script>
    <script src="config-global.js"></script>
    <script src="auth-controle.js"></script>

    <script>
        // --- LÓGICA DE SEGURANÇA: Captura o ID ÚNICO do usuário logado ---
        let idLoja = localStorage.getItem("idLojaAtual") || "lds-baber";

        firebase.auth().onAuthStateChanged((user) => {
            if (user) {
                // UID do Firebase é a chave definitiva de segurança
                idLoja = user.uid;
                localStorage.setItem("idLojaAtual", idLoja);
                atualizarLinksNav();
                // Recarrega a agenda do dia atual com o ID correto
                renderizarCarrossel();
            }
        });

        function atualizarLinksNav() {
            const links = {
                "linkAgenda": "painel-geral.html", "linkCaixa": "caixa.html",
                "linkVendas": "vendas.html", "linkEstoque": "estoque.html",
                "linkCadastro": "cadastro.html", "linkFaturamento": "faturamento.html",
                "linkConfig": "configuracoes.html"
            };
            const paginaAtual = window.location.pathname.split("/").pop();
            for (const [id, url] of Object.entries(links)) {
                const el = document.getElementById(id);
                if (el) {
                    el.href = `${url}?id=${idLoja}`;
                    el.classList.remove('active');
                    if (url === paginaAtual) el.classList.add('active');
                }
            }
        }

        // --- BOTÃO EXCLUSIVO COM UID ---
        function copiarLink() {
            const baseUrl = window.location.origin;
            const link = `${baseUrl}/teste-sistema-/agendar.html?id=${idLoja}`;
            
            navigator.clipboard.writeText(link).then(() => {
                alert("Link exclusivo copiado! \n" + link);
            }).catch(() => {
                alert("Copie o link manualmente: " + link);
            });
        }

        let dataBase = new Date();

        function renderizarCarrossel() {
            const container = document.getElementById('carrosselDatas');
            container.innerHTML = "";
            let temp = new Date(dataBase);
            temp.setDate(temp.getDate() - (temp.getDay() === 0 ? 6 : temp.getDay() - 1));
            document.getElementById('mesAnoDisplay').innerText = temp.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });

            for (let i = 0; i < 7; i++) {
                let dia = new Date(temp);
                dia.setDate(temp.getDate() + i);
                const div = document.createElement('div');
                div.className = 'card-dia';
                div.innerHTML = `<small>${dia.toLocaleDateString('pt-BR', { weekday: 'short' })}</small><br><strong>${dia.getDate()}</strong>`;
                div.onclick = () => {
                    document.querySelectorAll('.card-dia').forEach(c => c.classList.remove('active'));
                    div.classList.add('active');
                    carregarAgendaDia(dia);
                };
                container.appendChild(div);
            }
        }

        function mudarSemana(offset) {
            dataBase.setDate(dataBase.getDate() + (offset * 7));
            renderizarCarrossel();
        }

        function carregarAgendaDia(dataObj) {
            const dia = String(dataObj.getDate()).padStart(2, '0');
            const mes = String(dataObj.getMonth() + 1).padStart(2, '0');
            const ano = dataObj.getFullYear();
            const dataFormatada = `${dia}/${mes}/${ano}`;

            const tbody = document.getElementById("listaAgendamentos");
            tbody.innerHTML = "<tr><td colspan='5'>Carregando...</td></tr>";

            const db = firebase.firestore();
            db.collection("agenda_clientes")
              .where("estabelecimentoId", "==", idLoja)
              .where("dataFormatada", "==", dataFormatada)
              .onSnapshot(snap => {
                  tbody.innerHTML = "";
                  if (snap.empty) {
                      tbody.innerHTML = "<tr><td colspan='5'>Nenhum agendamento neste dia.</td></tr>";
                      return;
                  }
                  const agendamentos = [];
                  snap.forEach(doc => agendamentos.push(doc.data()));
                  agendamentos.sort((a, b) => a.horario.localeCompare(b.horario));
                  agendamentos.forEach(d => {
                      tbody.innerHTML += `
                        <tr>
                            <td>${d.cliente}</td>
                            <td>${d.horario}</td>
                            <td>${d.servico}</td>
                            <td>R$ ${parseFloat(d.valor || 0).toFixed(2)}</td>
                            <td><span class="status-badge">${d.status}</span></td>
                        </tr>`;
                  });
              });
        }
        renderizarCarrossel();
    </script>
</body>
</html>
