<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel de Agendamentos</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #121214; color: #e1e1e6; margin: 0; display: flex; overflow-x: hidden; }

        /* MENU LATERAL ESTREITO */
        .nav-sidebar { width: 160px; height: 100vh; position: fixed; background-color: #202024; z-index: 1000; padding: 20px 10px; border-right: 1px solid #323238; transition: 0.3s; }
        .nav-sidebar a { color: #ff9000; text-decoration: none; padding: 10px 5px; display: block; margin-bottom: 5px; border-radius: 5px; font-weight: bold; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .nav-sidebar a:hover { background-color: #2d2d34; }
        .sidebar-titulo { color: #a8a8a8; font-size: 12px; font-weight: bold; margin-bottom: 20px; text-align: center; }

        /* CONTEÚDO PRINCIPAL AJUSTADO */
        .main-content { padding: 20px; width: calc(100% - 160px); margin-left: 160px; transition: 0.3s; }

        /* BOTÃO HAMBÚRGUER */
        .btn-hamburger { display: none; position: fixed; top: 10px; left: 10px; z-index: 1001; background: #ff9000; border: none; padding: 8px; cursor: pointer; border-radius: 5px; }

        /* RESPONSIVIDADE E DIAS */
        .carrossel-dias { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0; justify-content: flex-start; margin-top: 10px; }
        .card-dia { background: #202024; padding: 10px; border-radius: 8px; min-width: 50px; text-align: center; cursor: pointer; border: 1px solid #323238; }
        .card-dia.active { border-color: #ff9000; background: #ff9000; color: #121214; }

        @media (max-width: 768px) {
            .nav-sidebar { left: -160px; }
            .nav-sidebar.active { left: 0; }
            .main-content { margin-left: 0; width: 100%; }
            .btn-hamburger { display: block; }
        }

        .seletor-semana { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 20px; }
        .btn-nav { background: #29292e; color: #ff9000; border: 1px solid #ff9000; padding: 8px 15px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .tabela-agenda { width: 100%; border-collapse: collapse; background: #202024; border-radius: 8px; overflow: hidden; margin-top: 20px; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #323238; }
        th { background-color: #29292e; color: #ff9000; }
        .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; background: #ff9000; color: #121214; font-weight: bold; }
    </style>
</head>
<body>

    <div class="main-content">
        <header style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #323238; padding-bottom: 20px; margin-bottom: 30px;">
            <h1>Agenda</h1>
            <button onclick="copiarLink()" style="background:#ff9000; color:#121214; border:none; padding:8px 12px; border-radius:4px; cursor:pointer; font-weight:bold;">Link de Agendamento</button>
        </header>

        <div class="seletor-semana">
            <button class="btn-nav" onclick="mudarSemana(-1)">◀</button>
            <span id="mesAnoDisplay" style="font-weight:bold; font-size: 18px;">---</span>
            <button class="btn-nav" onclick="mudarSemana(1)">▶</button>
        </div>

        <div class="carrossel-dias" id="carrosselDatas"></div>

        <table class="tabela-agenda">
            <thead>
                <tr><th>Cliente</th><th>Horário</th><th>Serviço</th><th>Valor</th><th>Status</th></tr>
            </thead>
            <tbody id="listaAgendamentos">
                <tr><td colspan="5">Selecione uma data acima.</td></tr>
            </tbody>
        </table>
    </div>

    <script src="menu.js"></script>
    <script src="firebase-init.js"></script>
    <script src="config-global.js"></script>
    <script src="auth-controle.js"></script>

    <script>
        let dataBase = new Date();

        function renderizarCarrossel() {
            const container = document.getElementById('carrosselDatas');
            container.innerHTML = "";
            let temp = new Date(dataBase);
            temp.setDate(temp.getDate() - (temp.getDay() === 0 ? 6 : temp.getDay() - 1));
            document.getElementById('mesAnoDisplay').innerText = temp.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });

            for (let i = 0; i < 7; i++) {
                let dia = new Date(temp);
                dia.setDate(temp.getDate() + i);
                const div = document.createElement('div');
                div.className = 'card-dia';
                div.innerHTML = `<small>${dia.toLocaleDateString('pt-BR', { weekday: 'short' })}</small><br><strong>${dia.getDate()}</strong>`;
                div.onclick = () => {
                    document.querySelectorAll('.card-dia').forEach(c => c.classList.remove('active'));
                    div.classList.add('active');
                    carregarAgendaDia(dia);
                };
                container.appendChild(div);
            }
        }

        function mudarSemana(offset) {
            dataBase.setDate(dataBase.getDate() + (offset * 7));
            renderizarCarrossel();
        }

        function carregarAgendaDia(dataObj) {
            const dataFormatada = dataObj.toLocaleDateString('pt-BR');
            const tbody = document.getElementById("listaAgendamentos");
            tbody.innerHTML = "<tr><td colspan='5'>Carregando...</td></tr>";

            firebase.firestore().collection("agenda_clientes")
                .where("estabelecimentoId", "==", localStorage.getItem("idLojaAtual"))
                .where("dataFormatada", "==", dataFormatada)
                .get().then(snap => {
                    tbody.innerHTML = "";
                    if (snap.empty) {
                        tbody.innerHTML = "<tr><td colspan='5'>Nenhum agendamento neste dia.</td></tr>";
                        return;
                    }
                    snap.forEach(doc => {
                        const d = doc.data();
                        tbody.innerHTML += `<tr><td>${d.cliente}</td><td>${d.horario}</td><td>${d.servico}</td><td>R$ ${d.valor}</td><td><span class="status-badge">${d.status}</span></td></tr>`;
                    });
                });
        }
        
        renderizarCarrossel();
    </script>
</body>
</html>
