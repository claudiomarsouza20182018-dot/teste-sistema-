<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <title>Painel de Agendamentos</title>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>



    <style>

        body { font-family: 'Segoe UI', sans-serif; background-color: #121214; color: #e1e1e6; margin: 0; padding-bottom: 80px; }



        /* Menu Horizontal na Base */

        .nav-bottom {

            position: fixed; bottom: 0; left: 0; width: 100%; height: 60px;

            background-color: #202024; display: flex; justify-content: space-around;

            align-items: center; border-top: 1px solid #323238; z-index: 1000; padding: 0 10px;

        }

        .nav-bottom a { color: #ff9000; text-decoration: none; font-weight: bold; font-size: 11px; text-align: center; padding: 5px; }

        .nav-bottom a:hover { color: #fff; }



        .main-content { padding: 20px; width: 100%; display: flex; flex-direction: column; align-items: center; }

        .content-wrapper { width: 100%; max-width: 900px; }



        .filtro-container { display: flex; justify-content: center; margin-bottom: 20px; }

        #seletorProfissional { background: #202024; color: #ff9000; border: 1px solid #ff9000; padding: 10px; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; max-width: 300px; }



        .carrossel-dias { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0; justify-content: center; margin-bottom: 20px; }

        .card-dia { background: #202024; padding: 10px; border-radius: 8px; min-width: 50px; text-align: center; cursor: pointer; border: 1px solid #323238; }

        .card-dia.active { border-color: #ff9000; background: #ff9000; color: #121214; }



        .seletor-semana { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 20px; }

        .btn-nav { background: #29292e; color: #ff9000; border: 1px solid #ff9000; padding: 8px 15px; cursor: pointer; border-radius: 4px; font-weight: bold; }

       

        .tabela-agenda { width: 100%; border-collapse: collapse; background: #202024; border-radius: 8px; overflow: hidden; }

        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #323238; }

        th { background-color: #29292e; color: #ff9000; }

        .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; background: #ff9000; color: #121214; font-weight: bold; }

       

        .btn-acao { border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold; margin-left: 5px; }

        .btn-atendido { background: #28a745; color: white; }

        .btn-cancelar { background: #dc3545; color: white; }

    </style>

</head>

<body>



    <div class="main-content">

        <div class="content-wrapper">

            <header style="display: flex; justify-content: flex-end; margin-bottom: 30px;">

                <button onclick="copiarLink()" style="background:#ff9000; color:#121214; border:none; padding:10px 20px; border-radius:4px; cursor:pointer; font-weight:bold;">Link de Agendamento</button>

            </header>



            <div class="filtro-container">

                <select id="seletorProfissional" onchange="renderizarAgendaAtual()">

                    <option value="todos">Todos os Profissionais</option>

                </select>

            </div>



            <div class="seletor-semana">

                <button class="btn-nav" onclick="mudarSemana(-1)">◀</button>

                <span id="mesAnoDisplay" style="font-weight:bold; font-size: 18px;">---</span>

                <button class="btn-nav" onclick="mudarSemana(1)">▶</button>

            </div>



            <div class="carrossel-dias" id="carrosselDatas"></div>



            <table class="tabela-agenda">

                <thead>

                    <tr><th>Cliente</th><th>Horário</th><th>Serviço</th><th>Valor</th><th>Status</th><th>Ações</th></tr>

                </thead>

                <tbody id="listaAgendamentos">

                    <tr><td colspan="6">Selecione uma data acima.</td></tr>

                </tbody>

            </table>

        </div>

    </div>



    <nav class="nav-bottom">

        <a href="painel-geral.html" style="color:white;">📅 Agenda</a>

        <a href="caixa.html"> Caixa</a>

        <a href="index.html">Venda</a>

        <a href="estoque.html">Estoque</a>

        <a href="cadastro.html">Cadastro</a>

        <a href="faturamento.html">Faturamento</a>

        <a href="configuracoes.html">⚙️</a>

        <a href="#" onclick="firebase.auth().signOut().then(()=>location.reload())" style="color:#ff4d4d;">Sair</a>

    </nav>



    <script src="firebase-init.js"></script>

    <script>

        let dataBase = new Date();

        let dataSelecionada = new Date();



        function carregarProfissionais() {

            const idLoja = localStorage.getItem("idLojaAtual");

            if (!idLoja) return;

            const select = document.getElementById("seletorProfissional");

            firebase.firestore().collection("config_profissionais")

                .where("estabelecimentoId", "==", idLoja)

                .onSnapshot(snap => {

                    select.innerHTML = '<option value="todos">Todos os Profissionais</option>';

                    snap.forEach(doc => {

                        select.innerHTML += `<option value="${doc.data().nome}">${doc.data().nome}</option>`;

                    });

                });

        }



        function renderizarCarrossel() {

            const container = document.getElementById('carrosselDatas');

            container.innerHTML = "";

            let temp = new Date(dataBase);

            temp.setDate(temp.getDate() - (temp.getDay() === 0 ? 6 : temp.getDay() - 1));

            document.getElementById('mesAnoDisplay').innerText = temp.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });



            for (let i = 0; i < 7; i++) {

                let dia = new Date(temp);

                dia.setDate(temp.getDate() + i);

                const div = document.createElement('div');

                div.className = 'card-dia';

                div.innerHTML = `<small>${dia.toLocaleDateString('pt-BR', { weekday: 'short' })}</small><br><strong>${dia.getDate()}</strong>`;

                div.onclick = () => {

                    document.querySelectorAll('.card-dia').forEach(c => c.classList.remove('active'));

                    div.classList.add('active');

                    dataSelecionada = dia;

                    carregarAgendaDia(dia);

                };

                container.appendChild(div);

            }

        }



        function renderizarAgendaAtual() { carregarAgendaDia(dataSelecionada); }



        async function carregarAgendaDia(dataObj) {

            const dataFormatada = dataObj.toLocaleDateString('pt-BR');

            const prof = document.getElementById("seletorProfissional").value;

            const tbody = document.getElementById("listaAgendamentos");

            tbody.innerHTML = "<tr><td colspan='6'>Carregando...</td></tr>";



            let query = firebase.firestore().collection("agenda_clientes")

                .where("estabelecimentoId", "==", localStorage.getItem("idLojaAtual"))

                .where("dataFormatada", "==", dataFormatada);



            if (prof !== "todos") query = query.where("profissional", "==", prof);



            const snap = await query.get();

            tbody.innerHTML = "";

           

            if (snap.empty) {

                tbody.innerHTML = "<tr><td colspan='6'>Nenhum agendamento neste dia.</td></tr>";

                return;

            }



            const servicosSnap = await firebase.firestore().collection("servicos")

                .where("estabelecimentoId", "==", localStorage.getItem("idLojaAtual")).get();

           

            const mapaPrecos = {};

            servicosSnap.forEach(doc => { mapaPrecos[doc.data().nome] = doc.data().preco; });



            snap.forEach(doc => {

                const d = doc.data();

                const idDoc = doc.id;

                const preco = mapaPrecos[d.servico] || "0,00";

               

                tbody.innerHTML += `<tr>

                    <td>${d.cliente}</td><td>${d.horario}</td><td>${d.servico}</td><td>R$ ${preco}</td>

                    <td><span class="status-badge">${d.status}</span></td>

                    <td>

                        <button class="btn-acao btn-atendido" onclick="atualizarStatus('${idDoc}', 'Atendido')">Atendido</button>

                        <button class="btn-acao btn-cancelar" onclick="atualizarStatus('${idDoc}', 'Cancelado')">Cancelar</button>

                    </td>

                </tr>`;

            });

        }



        function atualizarStatus(id, novoStatus) {

            firebase.firestore().collection("agenda_clientes").doc(id).update({ status: novoStatus })

                .then(() => renderizarAgendaAtual())

                .catch(err => console.error("Erro ao atualizar:", err));

        }



        function mudarSemana(offset) { dataBase.setDate(dataBase.getDate() + (offset * 7)); renderizarCarrossel(); }



        function copiarLink() {

            navigator.clipboard.writeText(`${window.location.origin}/agendar.html?id=${localStorage.getItem("idLojaAtual")}`);

            alert("Link copiado!");

        }



        window.onload = () => {

            carregarProfissionais();

            renderizarCarrossel();

            setTimeout(() => {

                const hoje = new Date().getDate();

                document.querySelectorAll('.card-dia').forEach(card => {

                    if (card.querySelector('strong').innerText == hoje) card.click();

                });

            }, 800);

        };

    </script>

</body>

</html>
