<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Painel de Agendamentos</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #121214; color: #e1e1e6; margin: 0; padding-bottom: 80px; font-size: 14px; }
        .main-content { padding: 60px 15px 15px 15px; width: 100%; box-sizing: border-box; }
        .content-wrapper { width: 100%; max-width: 900px; margin: 0 auto; }
        
        .header-top { display: flex; gap: 10px; margin-bottom: 15px; }
        #seletorProfissional { background: #202024; color: #ff9000; border: 1px solid #ff9000; padding: 10px; border-radius: 8px; font-weight: bold; width: 60%; }
        .btn-link { background:#ff9100; color:#fff; border:none; padding:10px; width: 40%; border-radius:8px; cursor:pointer; font-weight:bold; }

        .carrossel-dias { display: flex; gap: 8px; overflow-x: auto; padding: 5px 0; margin-bottom: 15px; }
        .card-dia { background: #202024; padding: 10px; border-radius: 8px; min-width: 50px; text-align: center; border: 1px solid #323238; }
        .card-dia.active { border-color: #ff9000; background: #ff9000; color: #121214; }
        
        /* Timeline Visual - Ajustada para Posicionamento */
        #listaAgendamentos { position: relative; height: 1300px; border-top: 1px solid #323238; margin-top: 20px; }
        .linha-hora { position: absolute; width: 100%; border-bottom: 1px solid #323238; height: 100px; }
        .label-hora { color: #666; font-size: 12px; font-weight: bold; padding: 5px; }
        
        .card-agendamento { position: absolute; left: 60px; right: 10px; background: #202024; border-left: 4px solid #ff9000; padding: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; z-index: 2; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .info-agendamento { display: flex; flex-direction: column; font-size: 12px; }
        .btn-acao { border: none; padding: 6px; border-radius: 4px; cursor: pointer; font-size: 10px; font-weight: bold; margin: 2px; }
        .btn-atendido { background: #28a745; color: white; }
        .btn-cancelar { background: #dc3545; color: white; }
        .btn-nav { background: #29292e; color: #ff9100; border: 1px solid #ff8800; padding: 10px 20px; cursor: pointer; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="menu-container"></div>

    <div class="main-content">
        <div class="content-wrapper">
            <div class="header-top">
                <select id="seletorProfissional" onchange="renderizarAgendaAtual()">
                    <option value="todos">Profissionais</option>
                </select>
                <button class="btn-link" onclick="copiarLink()">Link de Agendamento</button>
            </div>

            <div class="seletor-semana" style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px;">
                <button class="btn-nav" onclick="mudarSemana(-1)">◀</button>
                <span id="mesAnoDisplay" style="font-weight:bold; font-size: 16px;">---</span>
                <button class="btn-nav" onclick="mudarSemana(1)">▶</button>
            </div>

            <div class="carrossel-dias" id="carrosselDatas"></div>

            <div id="listaAgendamentos"></div>
        </div>
    </div>

    <script src="firebase-init.js"></script>
    <script src="menu.js"></script> 
    <script>
        let dataBase = new Date(); let dataSelecionada = new Date();
        const PIXELS_POR_HORA = 100; // Escala: cada hora ocupa 100px na tela

        function renderizarLinhasDeFundo() {
            const container = document.getElementById("listaAgendamentos");
            container.innerHTML = "";
            for (let h = 8; h <= 20; h++) {
                const divHora = document.createElement('div');
                divHora.className = 'linha-hora';
                divHora.style.top = ((h - 8) * PIXELS_POR_HORA) + 'px';
                divHora.innerHTML = `<div class="label-hora">${h.toString().padStart(2, '0')}:00</div>`;
                container.appendChild(divHora);
            }
        }

        async function carregarAgendaDia(dataObj) { 
            renderizarLinhasDeFundo();
            const dataFormatada = dataObj.toLocaleDateString('pt-BR'); 
            const prof = document.getElementById("seletorProfissional").value; 
            const container = document.getElementById("listaAgendamentos");
            
            let query = firebase.firestore().collection("agenda_clientes").where("estabelecimentoId", "==", localStorage.getItem("idLojaAtual")).where("dataFormatada", "==", dataFormatada); 
            if (prof !== "todos") query = query.where("profissional", "==", prof); 
            const snap = await query.get(); 
            
            const servicosSnap = await firebase.firestore().collection("servicos").where("estabelecimentoId", "==", localStorage.getItem("idLojaAtual")).get(); 
            const mapaPrecos = {}; const mapaDuracao = {};
            servicosSnap.forEach(doc => { mapaPrecos[doc.data().nome] = doc.data().preco; mapaDuracao[doc.data().nome] = doc.data().duracaoMinutos; }); 
            
            snap.forEach(doc => { 
                const d = doc.data();
                const [h, m] = d.horario.split(':').map(Number);
                const duracao = mapaDuracao[d.servico] || 30;
                
                // Cálculo de posição: (hora - início) + minutos
                const minutosDesdeInicio = (h - 8) * 60 + m;
                const topPos = minutosDesdeInicio * (PIXELS_POR_HORA / 60);
                const alturaCard = duracao * (PIXELS_POR_HORA / 60);

                const card = document.createElement('div');
                card.className = 'card-agendamento';
                card.style.top = topPos + 'px';
                card.style.height = (alturaCard - 5) + 'px'; // -5px para espaçamento
                card.innerHTML = `
                    <div class="info-agendamento">
                        <strong>${d.cliente}</strong>
                        <span>${d.horario} - ${d.servico} (${duracao}min)</span>
                        <small>R$ ${mapaPrecos[d.servico] || "0,00"} | ${d.status}</small>
                    </div>
                    <div style="display:flex; flex-direction:column;">
                        <button class="btn-acao btn-atendido" onclick="atualizarStatus('${doc.id}', 'Atendido')">✔</button>
                        <button class="btn-acao btn-cancelar" onclick="atualizarStatus('${doc.id}', 'Cancelado')">✖</button>
                    </div>`; 
                container.appendChild(card);
            }); 
        }

        // Funções mantidas
        function carregarProfissionais() { const idLoja = localStorage.getItem("idLojaAtual"); if (!idLoja) return; const select = document.getElementById("seletorProfissional"); firebase.firestore().collection("config_profissionais").where("estabelecimentoId", "==", idLoja).onSnapshot(snap => { select.innerHTML = '<option value="todos">Todos</option>'; snap.forEach(doc => { select.innerHTML += `<option value="${doc.data().nome}">${doc.data().nome}</option>`; }); }); }
        function renderizarCarrossel() { const container = document.getElementById('carrosselDatas'); container.innerHTML = ""; let temp = new Date(dataBase); temp.setDate(temp.getDate() - (temp.getDay() === 0 ? 6 : temp.getDay() - 1)); document.getElementById('mesAnoDisplay').innerText = temp.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' }); for (let i = 0; i < 7; i++) { let dia = new Date(temp); dia.setDate(temp.getDate() + i); const div = document.createElement('div'); div.className = 'card-dia'; div.innerHTML = `<small>${dia.toLocaleDateString('pt-BR', { weekday: 'short' })}</small><br><strong>${dia.getDate()}</strong>`; div.onclick = () => { document.querySelectorAll('.card-dia').forEach(c => c.classList.remove('active')); div.classList.add('active'); dataSelecionada = dia; carregarAgendaDia(dia); }; container.appendChild(div); } }
        function renderizarAgendaAtual() { carregarAgendaDia(dataSelecionada); }
        function atualizarStatus(id, novoStatus) { firebase.firestore().collection("agenda_clientes").doc(id).update({ status: novoStatus }).then(() => renderizarAgendaAtual()); }
        function mudarSemana(offset) { dataBase.setDate(dataBase.getDate() + (offset * 7)); renderizarCarrossel(); }
        function copiarLink() { navigator.clipboard.writeText(`${window.location.origin}/agendar.html?id=${localStorage.getItem("idLojaAtual")}`); alert("Link copiado!"); }
        window.onload = () => { carregarProfissionais(); renderizarCarrossel(); setTimeout(() => { const hoje = new Date().getDate(); document.querySelectorAll('.card-dia').forEach(card => { if (card.querySelector('strong').innerText == hoje) card.click(); }); }, 800); };
    </script>
</body>
</html>
