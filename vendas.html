<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Venda - LDS Barber</title>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #121214; color: #e1e1e6; margin: 0; padding: 0; }
        .main-content { padding: 80px 30px 30px 30px; } /* Aumentei o padding superior para o botão não cobrir o título */
        .produto-item { background: #202024; padding: 15px; margin: 10px 0; border-radius: 8px; display: flex; align-items: center; gap: 10px; border: 1px solid #323238; }
        input { width: 50px; padding: 8px; background: #121214; color: #fff; border: 1px solid #323238; border-radius: 4px; text-align: center; }
        button { padding: 8px 12px; cursor: pointer; border: none; border-radius: 4px; font-weight: bold; transition: opacity 0.2s; }
        button:hover { opacity: 0.8; }
    </style>
</head>
<body>

    <div id="menu-container"></div>

    <div class="main-content">
        <h1>Registrar Nova Venda</h1>
        <div id="listaProdutos">
            <p style="color: #a8a8a8;">Carregando produtos...</p>
        </div>
    </div>

    <script src="firebase-init.js"></script>
    <script src="config-global.js"></script>
    <script src="auth-controle.js"></script>
    <script src="menu.js"></script>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let idLoja = urlParams.get('id') || localStorage.getItem("idLojaAtual");
        
        if (!idLoja) {
            window.location.href = "index.html";
        } else {
            localStorage.setItem("idLojaAtual", idLoja);
        }

        window.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById("listaProdutos");
            
            window.db.collection("estoque")
                .where("estabelecimentoId", "==", idLoja)
                .onSnapshot((snapshot) => {
                    container.innerHTML = "";
                    if(snapshot.empty) { 
                        container.innerHTML = `<p>Nenhum produto encontrado.</p>`; 
                        return; 
                    }

                    snapshot.forEach((doc) => {
                        const prod = doc.data();
                        const cat = prod.categoria || 'Geral';
                        const div = document.createElement("div");
                        div.className = "produto-item";
                        div.innerHTML = `
                            <div style="flex-grow: 1;">
                                <strong>${prod.nome || 'Sem nome'}</strong><br>
                                <span style="color: #ff9000;">R$ ${prod.preco || '0.00'}</span> 
                                <small style="color: #666;">(Estoque: ${prod.quantidade || 0} | Cat: ${cat})</small>
                            </div>
                            <input type="number" id="qtd_${doc.id}" value="1" min="1">
                            <button onclick="vender('${doc.id}', '${prod.nome}', ${prod.preco}, '${cat}', 'Pix')" style="background: #008080; color: #fff;">Pix</button>
                            <button onclick="vender('${doc.id}', '${prod.nome}', ${prod.preco}, '${cat}', 'Dinheiro')" style="background: #28a745; color: #fff;">Dinheiro</button>
                            <button onclick="vender('${doc.id}', '${prod.nome}', ${prod.preco}, '${cat}', 'Cartão')" style="background: #007bff; color: #fff;">Cartão</button>
                        `;
                        container.appendChild(div);
                    });
                });
        });

        function vender(produtoId, nome, preco, categoria, forma) {
            const qtdInput = document.getElementById(`qtd_${produtoId}`);
            const qtdVendida = parseInt(qtdInput.value);
            
            if (qtdVendida <= 0) {
                alert("Quantidade inválida!");
                return;
            }

            const total = preco * qtdVendida;
            const produtoRef = window.db.collection("estoque").doc(produtoId);
            const vendaRef = window.db.collection("historico_vendas").doc();

            window.db.runTransaction((transaction) => {
                return transaction.get(produtoRef).then((doc) => {
                    if (!doc.exists) throw "Produto não encontrado!";
                    const estoqueAtual = doc.data().quantidade || 0;
                    if (estoqueAtual < qtdVendida) throw "Estoque insuficiente!";
                    transaction.update(produtoRef, { quantidade: estoqueAtual - qtdVendida });
                    transaction.set(vendaRef, {
                        produtoId: produtoId,
                        nomeProduto: nome,
                        categoria: categoria,
                        quantidade: qtdVendida,
                        valorTotal: total,
                        formaPagamento: forma,
                        estabelecimentoId: idLoja,
                        timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    });
                });
            })
            .then(() => alert(`Venda de ${nome} realizada com sucesso!`))
            .catch(err => {
                console.error("Erro:", err);
                alert("Erro ao processar venda: " + err);
            });
        }
    </script>
</body>
</html>
