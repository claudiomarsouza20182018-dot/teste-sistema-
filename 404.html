<!DOCTYPE html>
<html>
<head>
    <script>
        // Esta página intercepta o erro 404 e redireciona para a página correta
        // com os parâmetros (ex: ?id=claudiomar-alves) intactos.
        var path = window.location.pathname;
        var search = window.location.search;
        
        if (path.includes("agendar.html")) {
            window.location.replace("/agendar.html" + search);
        } else {
            // Se não for a página de agendamento, volta para a home
            window.location.replace("/");
        }
    </script>
</head>
<body>
    <p>Redirecionando...</p>
</body>
</html>
