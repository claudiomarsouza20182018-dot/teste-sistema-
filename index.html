<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Lds Barber & Tattoo</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #121214; color: #e1e1e6; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card-login { background: #202024; padding: 40px; border-radius: 8px; border: 1px solid #323238; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
        h1 { font-size: 26px; color: #fff; margin-bottom: 8px; }
        p { color: #a8a8a8; font-size: 14px; margin-bottom: 35px; line-height: 1.4; }
        .btn-google { width: 100%; background: #fff; color: #121214; border: none; padding: 14px 20px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 12px; transition: background 0.2s; }
        .btn-google:hover { background: #e1e1e6; }
        .btn-google img { width: 22px; height: 22px; }
    </style>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

<div class="card-login">
    <h1>Lds Barber & Tattoo</h1>
    <p>Acesse sua conta para gerenciar agendamentos, caixa, estoque e faturamento.</p>

    <button id="btn-login-google" class="btn-google">
        <img src="https://fonts.gstatic.com/s/i/productlogos/googleg/v6/web-24dp/logo_googleg_color_24dp.png" alt="Google">
        Entrar com o Google
    </button>
</div>

<script src="firebase-init.js"></script>
<script src="config-global.js"></script>
<script src="auth-controle.js"></script>

<script>
    document.getElementById("btn-login-google").addEventListener("click", function() {
        if (typeof loginComGoogle === "function") {
            loginComGoogle();
        } else {
            alert("Erro: O arquivo auth-controle.js não foi carregado corretamente.");
        }
    });
</script>

</body>
</html>
