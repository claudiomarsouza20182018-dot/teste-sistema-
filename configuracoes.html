<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Configurações - LDS Barber</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #121214; color: #e1e1e6; margin: 0; padding: 0; display: flex; min-height: 100vh; }
        .nav-sidebar { width: 170px; background-color: #202024; border-right: 1px solid #323238; display: flex; flex-direction: column; padding: 20px 10px; position: fixed; height: 100vh; box-sizing: border-box; }
        .sidebar-titulo { color: #a8a8a8; font-size: 12px; font-weight: bold; padding-left: 10px; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; }
        .nav-sidebar a { color: #ff9000; text-decoration: none; font-weight: bold; font-size: 12px; padding: 12px 10px; margin-bottom: 8px; border-radius: 5px; transition: background 0.2s; }
        .nav-sidebar a:hover { background-color: #2d2d34; }
        .nav-sidebar a.active { color: #fff; background-color: #ff9000; }
        .main-content { flex: 1; margin-left: 170px; padding: 30px; }
        .card-config { background: #202024; padding: 20px; border-radius: 8px; border: 1px solid #323238; margin-bottom: 20px; }
        input { padding: 10px; border-radius: 4px; border: 1px solid #323238; background: #121214; color: #fff; margin-right: 10px; }
        button { padding: 10px 15px; cursor: pointer; background: #ff9000; border: none; color: #121214; font-weight: bold; border-radius: 4px; }
        .item-lista { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #323238; align-items: center; }
    </style>
</head>
<body>

    <div class="nav-sidebar">
        <a href="#" id="linkAgenda">📅 Agenda</a>
        <a href="#" id="linkCaixa">💰 Caixa Diário</a>
        <a href="#" id="linkVendas">Registrar Venda</a>
        <a href="#" id="linkEstoque">Ver Estoque</a>
        <a href="#" id="linkCadastro">Cadastrar/Entrada</a>
        <a href="#" id="linkFaturamento">Faturamento</a>
        <a href="#" id="linkConfig" class="active">⚙️ Configurações</a>
    </div>

    <div class="main-content">
        <h1>Configurações da Barbearia</h1>
        
        <div class="card-config">
            <h3>Profissionais</h3>
            <form id="formNovoProfissional">
                <input type="text" id="barbeiroNome" placeholder="Nome do Barbeiro" required>
                <button type="submit">Adicionar</button>
            </form>
            <div id="listaProfissionais" style="margin-top: 15px;"></div>
        </div>

        <div class="card-config">
            <h3>Serviços e Preços</h3>
            <form id="formNovoServico">
                <input type="text" id="servicoNome" placeholder="Nome do Serviço" required>
                <input type="number" id="servicoPreco" placeholder="Preço R$" required>
                <input type="number" id="servicoTempo" placeholder="Tempo (min)" required>
                <button type="submit">Adicionar Serviço</button>
            </form>
            <div id="listaServicos" style="margin-top: 15px;"></div>
        </div>
    </div>

    <script src="firebase-init.js"></script>
    <script src="config-global.js"></script>
    <script src="auth-controle.js"></script>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let idLoja = urlParams.get('id') || localStorage.getItem("idLojaAtual");
        if (idLoja) localStorage.setItem("idLojaAtual", idLoja);

        const links = { "linkAgenda":"painel-geral.html", "linkCaixa":"caixa.html", "linkVendas":"index.html", "linkEstoque":"estoque.html", "linkCadastro":"cadastro.html", "linkFaturamento":"faturamento.html" };
        for (const [id, url] of Object.entries(links)) {
            const el = document.getElementById(id);
            if (el && idLoja) el.href = `${url}?id=${idLoja}`;
        }

        // --- Lógica de Profissionais ---
        document.getElementById("formNovoProfissional").addEventListener("submit", (e) => {
            e.preventDefault();
            const nome = document.getElementById("barbeiroNome").value.trim();
            window.db.collection("config_profissionais").add({ nome: nome, estabelecimentoId: idLoja });
            document.getElementById("barbeiroNome").value = "";
        });

        // --- Lógica de Serviços ---
        document.getElementById("formNovoServico").addEventListener("submit", (e) => {
            e.preventDefault();
            window.db.collection("servicos").add({
                estabelecimentoId: idLoja,
                nome: document.getElementById("servicoNome").value,
                preco: parseFloat(document.getElementById("servicoPreco").value),
                duracaoMinutos: parseInt(document.getElementById("servicoTempo").value),
                ativo: true
            });
            document.getElementById("formNovoServico").reset();
        });

        function carregarDados() {
            // Carregar Profissionais
            window.db.collection("config_profissionais").where("estabelecimentoId", "==", idLoja).onSnapshot(snap => {
                const container = document.getElementById("listaProfissionais");
                container.innerHTML = "";
                snap.forEach(doc => {
                    container.innerHTML += `<div class="item-lista">👤 ${doc.data().nome} <button onclick="deletar('config_profissionais', '${doc.id}')">X</button></div>`;
                });
            });

            // Carregar Serviços
            window.db.collection("servicos").where("estabelecimentoId", "==", idLoja).onSnapshot(snap => {
                const container = document.getElementById("listaServicos");
                container.innerHTML = "";
                snap.forEach(doc => {
                    const s = doc.data();
                    container.innerHTML += `<div class="item-lista">✂️ ${s.nome} - R$ ${s.preco} (${s.duracaoMinutos}min) <button onclick="deletar('servicos', '${doc.id}')">X</button></div>`;
                });
            });
        }

        function deletar(colecao, id) { window.db.collection(colecao).doc(id).delete(); }

        window.onload = () => { if (idLoja) carregarDados(); };
    </script>
</body>
</html>
