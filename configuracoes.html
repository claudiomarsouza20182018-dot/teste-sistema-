<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Configurações - LDS Barber</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #121214; color: #e1e1e6; margin: 0; padding: 0; display: flex; min-height: 100vh; }
        .nav-sidebar { width: 170px; background-color: #202024; border-right: 1px solid #323238; display: flex; flex-direction: column; padding: 20px 10px; position: fixed; height: 100vh; box-sizing: border-box; }
        .sidebar-titulo { color: #a8a8a8; font-size: 12px; font-weight: bold; padding-left: 10px; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; }
        .nav-sidebar a { color: #ff9000; text-decoration: none; font-weight: bold; font-size: 12px; padding: 12px 10px; margin-bottom: 8px; border-radius: 5px; transition: background 0.2s; }
        .nav-sidebar a:hover { background-color: #2d2d34; }
        .nav-sidebar a.active { color: #fff; background-color: #ff9000; }
        .main-content { flex: 1; margin-left: 170px; padding: 30px; }
        .tabela-estoque { width: 100%; border-collapse: collapse; background: #202024; border: 1px solid #323238; }
        .tabela-estoque th { background-color: #29292e; color: #ff9000; padding: 12px; text-align: left; }
        .tabela-estoque td { padding: 12px; border-bottom: 1px solid #29292e; }
    </style>
</head>
<body>

    <div class="nav-sidebar">
        <span class="sidebar-titulo">LDS Barber</span>
        <a href="#" id="linkAgenda">📅 Agenda</a>
        <a href="#" id="linkCaixa">💰 Caixa Diário</a>
        <a href="#" id="linkVendas">Registrar Venda</a>
        <a href="#" id="linkEstoque">Ver Estoque</a>
        <a href="#" id="linkCadastro">Cadastrar/Entrada</a>
        <a href="#" id="linkFaturamento">Faturamento</a>
        <a href="#" id="linkConfig" class="active">⚙️ Configurações</a>
    </div>

    <div class="main-content">
        <h1>Configurações da Barbearia</h1>
        <h3>Profissionais</h3>
        <form id="formNovoProfissional">
            <input type="text" id="barbeiroNome" placeholder="Nome do Barbeiro" required>
            <button type="submit">Adicionar Barbeiro</button>
        </form>
        <div id="listaProfissionais" style="margin-top: 20px;"></div>
    </div>

    <script src="firebase-init.js"></script>
    <script src="config-global.js"></script>
    <script src="auth-controle.js"></script>

    <script>
        // 1. Persistência de ID
        const urlParams = new URLSearchParams(window.location.search);
        let idLoja = urlParams.get('id') || localStorage.getItem("idLojaAtual");
        if (idLoja) localStorage.setItem("idLojaAtual", idLoja);

        // 2. Links do menu
        const links = { "linkAgenda":"painel-geral.html", "linkCaixa":"caixa.html", "linkVendas":"index.html", "linkEstoque":"estoque.html", "linkCadastro":"cadastro.html", "linkFaturamento":"faturamento.html" };
        for (const [id, url] of Object.entries(links)) {
            const el = document.getElementById(id);
            if (el && idLoja) el.href = `${url}?id=${idLoja}`;
        }

        // 3. Funções do Banco
        document.getElementById("formNovoProfissional").addEventListener("submit", (e) => {
            e.preventDefault();
            const nome = document.getElementById("barbeiroNome").value.trim();
            window.db.collection("config_profissionais").add({ nome: nome, estabelecimentoId: idLoja });
            document.getElementById("barbeiroNome").value = "";
        });

        function carregarProfissionais() {
            window.db.collection("config_profissionais")
                .where("estabelecimentoId", "==", idLoja)
                .onSnapshot(snap => {
                    const container = document.getElementById("listaProfissionais");
                    container.innerHTML = "";
                    snap.forEach(doc => {
                        container.innerHTML += `<div class="card-barbeiro"><span>👤 ${doc.data().nome}</span><button onclick="deletar('${doc.id}')">X</button></div>`;
                    });
                });
        }

        function deletar(id) { window.db.collection("config_profissionais").doc(id).delete(); }

        window.onload = () => { if (idLoja) carregarProfissionais(); };
    </script>
</body>
</html>
