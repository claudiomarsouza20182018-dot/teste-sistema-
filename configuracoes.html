<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações - LDS Barber</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #121214; color: #e1e1e6; margin: 0; padding: 0; }
        .main-content { padding: 80px 30px 30px 30px; }
        .card-config { background: #202024; padding: 20px; border-radius: 8px; border: 1px solid #323238; margin-bottom: 20px; }
        input { padding: 8px; border-radius: 4px; border: 1px solid #323238; background: #121214; color: #fff; margin-right: 5px; }
        button { padding: 8px 12px; cursor: pointer; background: #ff9000; border: none; color: #121214; font-weight: bold; border-radius: 4px; margin-left: 5px; }
        .item-lista { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #323238; align-items: center; }
        .btn-edit { background: #4a4a50; color: white; }
        .btn-del { background: #d32f2f; color: white; }
        .input-edit { width: 90px; }
    </style>
</head>
<body>

    <div id="menu-container"></div>

    <div class="main-content">
        <h1>Configurações da Barbearia</h1>
        
        <div class="card-config">
            <h3>Profissionais</h3>
            <form id="formNovoProfissional">
                <input type="text" id="barbeiroNome" placeholder="Nome do Barbeiro" required>
                <button type="submit">Adicionar</button>
            </form>
            <div id="listaProfissionais" style="margin-top: 15px;"></div>
        </div>

        <div class="card-config">
            <h3>Serviços e Preços</h3>
            <form id="formNovoServico">
                <input type="text" id="servicoNome" placeholder="Nome do Serviço" required>
                <input type="number" id="servicoPreco" placeholder="Preço R$" required>
                <input type="number" id="servicoTempo" placeholder="Tempo (min)" required>
                <button type="submit">Adicionar Serviço</button>
            </form>
            <div id="listaServicos" style="margin-top: 15px;"></div>
        </div>
    </div>

    <script src="firebase-init.js"></script>
    <script src="config-global.js"></script>
    <script src="auth-controle.js"></script>
    <script src="menu.js"></script>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let idLoja = urlParams.get('id') || localStorage.getItem("idLojaAtual");
        if (idLoja) localStorage.setItem("idLojaAtual", idLoja);
        
        let cacheDados = {};

        function editar(id, colecao) {
            const data = cacheDados[id];
            const div = document.getElementById(id);
            
            if (colecao === 'config_profissionais') {
                div.innerHTML = `
                    <div>👤 <input type="text" id="editNome_${id}" value="${data.nome}"></div>
                    <button onclick="salvar('${colecao}', '${id}', {nome: document.getElementById('editNome_${id}').value})">💾</button>
                `;
            } else {
                div.innerHTML = `
                    <div style="display: flex; gap: 10px; align-items: center; flex-grow: 1;">
                        ✂️ <input type="text" id="editNome_${id}" value="${data.nome}" style="width:120px" placeholder="Nome">
                        <input type="number" id="editPreco_${id}" value="${data.preco}" style="width:80px" placeholder="R$">
                        <input type="number" id="editTempo_${id}" value="${data.duracaoMinutos}" style="width:60px" placeholder="Min">
                    </div>
                    <button onclick="salvar('${colecao}', '${id}', {
                        nome: document.getElementById('editNome_${id}').value,
                        preco: parseFloat(document.getElementById('editPreco_${id}').value), 
                        duracaoMinutos: parseInt(document.getElementById('editTempo_${id}').value)
                    })">💾</button>
                `;
            }
        }

        function salvar(colecao, id, dados) {
            window.db.collection(colecao).doc(id).update(dados).then(() => {
                alert("Atualizado com sucesso!");
                carregarDados();
            });
        }

        function deletar(colecao, id) { if(confirm("Confirmar exclusão?")) window.db.collection(colecao).doc(id).delete(); }

        function carregarDados() {
            // Profissionais
            window.db.collection("config_profissionais").where("estabelecimentoId", "==", idLoja).onSnapshot(snap => {
                const container = document.getElementById("listaProfissionais");
                container.innerHTML = "";
                snap.forEach(doc => {
                    cacheDados[doc.id] = doc.data();
                    container.innerHTML += `<div class="item-lista" id="${doc.id}">👤 ${doc.data().nome} 
                        <div><button class="btn-edit" onclick="editar('${doc.id}', 'config_profissionais')">✏️</button>
                        <button class="btn-del" onclick="deletar('config_profissionais', '${doc.id}')">X</button></div></div>`;
                });
            });

            // Serviços
            window.db.collection("servicos").where("estabelecimentoId", "==", idLoja).onSnapshot(snap => {
                const container = document.getElementById("listaServicos");
                container.innerHTML = "";
                snap.forEach(doc => {
                    const s = doc.data();
                    cacheDados[doc.id] = s;
                    container.innerHTML += `<div class="item-lista" id="${doc.id}">✂️ ${s.nome} - R$ ${s.preco} (${s.duracaoMinutos}min) 
                        <div><button class="btn-edit" onclick="editar('${doc.id}', 'servicos')">✏️</button>
                        <button class="btn-del" onclick="deletar('servicos', '${doc.id}')">X</button></div></div>`;
                });
            });
        }

        window.onload = async () => { 
            // Opcional: Se o seu menu.js precisar ser chamado manualmente:
            // if(typeof renderizarMenu === 'function') renderizarMenu(); 
            
            if (idLoja) carregarDados(); 
        };
    </script>
</body>
</html>
