<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lds Barber - Agenda do Dia</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #121214; color: #e1e1e6; margin: 0; padding: 0; display: flex; min-height: 100vh; }
        .nav-sidebar { width: 170px; background-color: #202024; border-right: 1px solid #323238; display: flex; flex-direction: column; padding: 20px 10px; position: fixed; height: 100vh; box-sizing: border-box; z-index: 100; }
        .sidebar-titulo { color: #a8a8a8; font-size: 12px; font-weight: bold; padding-left: 10px; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; }
        .nav-sidebar a { color: #ff9000; text-decoration: none; font-weight: bold; font-size: 12px; padding: 12px 10px; margin-bottom: 8px; border-radius: 5px; transition: background 0.2s; }
        .nav-sidebar a:hover { background-color: #2d2d34; }
        .nav-sidebar a.active { color: #fff; background-color: #ff9000; }
        .main-content { flex: 1; margin-left: 170px; padding: 30px; }
    </style>
</head>
<body>
    <div class="nav-sidebar">
        <span class="sidebar-titulo">LDS Barber</span>
        <a href="#" id="linkAgenda">📅 Agenda</a>
        <a href="#" id="linkCaixa">💰 Caixa Diário</a>
        <a href="#" id="linkVendas">Registrar Venda</a>
        <a href="#" id="linkEstoque">Ver Estoque</a>
        <a href="#" id="linkCadastro">Cadastrar/Entrada</a>
        <a href="#" id="linkFaturamento">Faturamento</a>
        <a href="#" id="linkConfig">⚙️ Configurações</a>
    </div>

    <div class="main-content">
        <h1>📅 Agenda de Atendimentos</h1>
        <div id="carrosselDias"></div>
        <div id="listaCompromissosApp"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <script src="firebase-init.js"></script>
    <script src="config-global.js"></script>
    <script src="auth-controle.js"></script>

    <script>
        // 1. Persistência de ID
        const urlParams = new URLSearchParams(window.location.search);
        let idLoja = urlParams.get('id') || localStorage.getItem("idLojaAtual");
        if (idLoja) localStorage.setItem("idLojaAtual", idLoja);

        // 2. Mapeamento de links (IDs no HTML -> Nome do arquivo)
        const links = {
            "linkAgenda": "painel-geral.html", 
            "linkCaixa": "caixa.html",
            "linkVendas": "vendas.html", 
            "linkEstoque": "estoque.html",
            "linkCadastro": "cadastro.html", 
            "linkFaturamento": "faturamento.html",
            "linkConfig": "configuracoes.html"
        };

        // 3. Aplicar links e classe ativa (automático)
        const paginaAtual = window.location.pathname.split("/").pop();
        
        for (const [id, url] of Object.entries(links)) {
            const el = document.getElementById(id);
            if (el) {
                el.href = `${url}?id=${idLoja || ''}`;
                
                // Remove destaque anterior e aplica se for a página atual
                el.classList.remove('active');
                if (url === paginaAtual) {
                    el.classList.add('active');
                }
            }
        }

        // 4. Carregamento de dados
        window.onload = () => {
            if (typeof montarCarrosselDias === 'function') montarCarrosselDias();
            if (typeof carregarAgendaDoDia === 'function') carregarAgendaDoDia();
        };
    </script>
</body>
</html>
