<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="tituloAba">Agendamento Online</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="firebase-init.js"></script> 

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121214; color: #e1e1e6; padding: 20px; display: flex; justify-content: center; }
        .container-agendamento { width: 100%; max-width: 450px; background: #202024; padding: 25px; border-radius: 8px; border: 1px solid #323238; box-shadow: 0 4px 10px rgba(0,0,0,0.3); margin-bottom: 20px; }
        h2 { text-align: center; color: #fff; margin-bottom: 5px; font-size: 22px; }
        p.sub { text-align: center; color: #a8a8a8; font-size: 14px; margin-bottom: 25px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 8px; color: #e1e1e6; font-size: 14px; font-weight: bold; }
        input[type="text"], input[type="tel"], input[type="date"], select { width: 100%; padding: 12px; background: #121214; border: 1px solid #323238; border-radius: 6px; color: #fff; font-size: 16px; outline: none; }
        input:focus, select:focus { border-color: #ff9000; }
        .grade-horarios { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
        .btn-horario { background: #29292e; color: #fff; border: 1px solid #323238; padding: 12px 5px; border-radius: 6px; font-weight: bold; font-size: 15px; cursor: pointer; text-align: center; transition: 0.2s; }
        .btn-horario:hover { border-color: #ff9000; }
        .btn-horario.selecionado { background: #ff9000; color: #121214; border-color: #ff9000; }
        .btn-confirmar { width: 100%; background: #00b37e; color: #fff; border: none; padding: 15px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 25px; transition: background 0.2s; }
        .btn-confirmar:hover { background: #00875f; }
        .aviso-vazio { grid-column: span 3; text-align: center; color: #f75a68; font-size: 14px; padding: 10px; }
    </style>
</head>
<body>

<div style="width: 100%; max-width: 450px;">
    <div class="container-agendamento">
        <h2 id="nomeEstabelecimento">Carregando...</h2>
        <p class="sub">Reserve seu horário</p>

        <form id="formAgendamento">
            <div class="form-group">
                <label for="nomeCliente">Seu Nome</label>
                <input type="text" id="nomeCliente" required>
            </div>
            <div class="form-group">
                <label for="whatsappCliente">WhatsApp</label>
                <input type="tel" id="whatsappCliente" required>
            </div>
            <div class="form-group">
                <label for="profissionalSelecionado">Escolha o Profissional</label>
                <select id="profissionalSelecionado" required><option value="">Carregando...</option></select>
            </div>
            <div class="form-group">
                <label for="servicoSelecionado">Escolha o Serviço</label>
                <select id="servicoSelecionado" required><option value="">Carregando...</option></select>
            </div>
            <div class="form-group">
                <label for="dataAgendamento">Escolha o Dia</label>
                <input type="date" id="dataAgendamento" required>
            </div>
            <div class="form-group">
                <label>Horários Disponíveis</label>
                <div class="grade-horarios" id="containerHorarios">
                    <p class="aviso-vazio">Selecione o Profissional, o Serviço e a Data.</p>
                </div>
            </div>
            <button type="submit" class="btn-confirmar">Confirmar Agendamento</button>
        </form>
    </div>

    <div class="container-agendamento">
        <h2>Meus Agendamentos</h2>
        <div class="form-group">
            <label for="buscarWhatsapp">Verificar agendamentos (WhatsApp):</label>
            <input type="tel" id="buscarWhatsapp" placeholder="(00) 00000-0000">
            <button id="btnBuscar" class="btn-confirmar" style="background: #323238; margin-top: 10px;">Buscar Agendamentos</button>
        </div>
        <div id="resultadoBusca" style="color: #fff;"></div>
    </div>
</div>

<script>
    const db = firebase.firestore();
    const urlParams = new URLSearchParams(window.location.search);
    let estabelecimentoId = urlParams.get('id') || "claudiomar-alves";
    let horarioSelecionadoGlobal = null;

    // --- Carregamento Inicial ---
    db.collection("usuarios").where("estabelecimentoId", "==", estabelecimentoId).get().then(snap => {
        if (!snap.empty) document.getElementById("nomeEstabelecimento").innerText = snap.docs[0].data().nomeBarbearia;
    });

    db.collection("servicos").where("estabelecimentoId", "==", estabelecimentoId).where("ativo", "==", true).get().then(snap => {
        const select = document.getElementById("servicoSelecionado");
        select.innerHTML = '<option value="">Selecione um serviço</option>';
        snap.forEach(doc => {
            const s = doc.data();
            select.innerHTML += `<option value="${s.nome}" data-preco="${s.preco}" data-tempo="${s.duracaoMinutos || 30}">${s.nome} - ${s.duracaoMinutos} min</option>`;
        });
    });

    db.collection("config_profissionais").where("estabelecimentoId", "==", estabelecimentoId).get().then(snap => {
        const select = document.getElementById("profissionalSelecionado");
        select.innerHTML = '<option value="">Selecione um profissional</option>';
        snap.forEach(doc => {
            select.innerHTML += `<option value="${doc.data().nome}">${doc.data().nome}</option>`;
        });
    });

    document.getElementById("dataAgendamento").min = new Date().toISOString().split("T")[0];

    // --- Função de Lógica de Horários ---
    function carregarHorarios() {
        const prof = document.getElementById("profissionalSelecionado").value;
        const data = document.getElementById("dataAgendamento").value;
        const servicoEl = document.getElementById("servicoSelecionado");
        const duracaoNova = parseInt(servicoEl.options[servicoEl.selectedIndex]?.getAttribute("data-tempo") || 0);
        const container = document.getElementById("containerHorarios");

        if (!prof || !data || !duracaoNova) return;

        container.innerHTML = "Carregando...";
        horarioSelecionadoGlobal = null;

        const [ano, mes, dia] = data.split("-");
        const dataFormatadaBusca = `${dia}/${mes}/${ano}`;
        
        db.collection("agenda_clientes")
          .where("estabelecimentoId", "==", estabelecimentoId)
          .where("profissional", "==", prof)
          .where("dataFormatada", "==", dataFormatadaBusca)
          .get().then(snap => {
            let intervalosOcupados = [];
            snap.forEach(doc => {
                const ag = doc.data();
                const [h, m] = ag.horario.split(':').map(Number);
                const inicioMin = h * 60 + m;
                intervalosOcupados.push({ inicio: inicioMin, fim: inicioMin + (ag.duracaoMinutos || 30) });
            });

            container.innerHTML = "";
            for (let min = (9 * 60); min < (19 * 60); min += 5) {
                let fimNovo = min + duracaoNova;
                if (fimNovo > (19 * 60)) break;
                let temConflito = intervalosOcupados.some(ag => (min < ag.fim && fimNovo > ag.inicio));
                if (temConflito) continue;

                let h = Math.floor(min / 60);
                let m = min % 60;
                let hr = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;

                const b = document.createElement("div");
                b.className = "btn-horario";
                b.innerText = hr;
                b.onclick = () => {
                    document.querySelectorAll(".btn-horario").forEach(i => i.classList.remove("selecionado"));
                    b.classList.add("selecionado");
                    horarioSelecionadoGlobal = hr;
                };
                container.appendChild(b);
            }
            if (container.innerHTML === "") container.innerHTML = '<p class="aviso-vazio">Sem horários disponíveis.</p>';
        });
    }

    // --- Listeners ---
    document.getElementById("dataAgendamento").addEventListener("change", carregarHorarios);
    document.getElementById("servicoSelecionado").addEventListener("change", carregarHorarios);
    document.getElementById("profissionalSelecionado").addEventListener("change", carregarHorarios);

    // --- Envio de Agendamento ---
    document.getElementById("formAgendamento").addEventListener("submit", function(e) {
        e.preventDefault();
        if (!horarioSelecionadoGlobal) return alert("Por favor, selecione um horário.");
        
        const selS = document.getElementById("servicoSelecionado");
        db.collection("agenda_clientes").add({
            estabelecimentoId: estabelecimentoId,
            cliente: document.getElementById("nomeCliente").value,
            whatsapp: document.getElementById("whatsappCliente").value.replace(/\D/g, ''),
            profissional: document.getElementById("profissionalSelecionado").value,
            servico: selS.value,
            duracaoMinutos: parseInt(selS.options[selS.selectedIndex].getAttribute("data-tempo")),
            horario: horarioSelecionadoGlobal,
            dataFormatada: document.getElementById("dataAgendamento").value.split("-").reverse().join("/"),
            status: "Aguardando",
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        }).then(() => { alert("Agendado com sucesso!"); location.reload(); });
    });

    // --- Busca e Cancelamento ---
    document.getElementById("btnBuscar").addEventListener("click", function() {
        const wpp = document.getElementById("buscarWhatsapp").value.replace(/\D/g, '');
        const resDiv = document.getElementById("resultadoBusca");
        if (!wpp) return alert("Digite o WhatsApp.");
        
        db.collection("agenda_clientes").where("whatsapp", "==", wpp).orderBy("timestamp", "desc").get().then(snap => {
            resDiv.innerHTML = "";
            if (snap.empty) return resDiv.innerHTML = "Nenhum agendamento encontrado.";

            snap.forEach(doc => {
                const ag = doc.data();
                const card = document.createElement("div");
                card.style = "background: #29292e; padding: 15px; border-radius: 8px; margin-bottom: 10px;";
                card.innerHTML = `<p><b>${ag.servico}</b> - ${ag.dataFormatada} às ${ag.horario}</p>
                                  <button onclick="cancelar('${doc.id}')" style="background:#f75a68; color:white; border:none; padding:8px; width:100%; border-radius:4px; cursor:pointer;">Cancelar</button>`;
                resDiv.appendChild(card);
            });
        });
    });

    function cancelar(id) {
        if (confirm("Confirmar cancelamento?")) {
            db.collection("agenda_clientes").doc(id).delete().then(() => { alert("Cancelado!"); location.reload(); });
        }
    }
</script>
</body>
</html>
