<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento Online</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="firebase-init.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #121214; color: #e1e1e6; padding: 20px; display: flex; justify-content: center; }
        .container-agendamento { width: 100%; max-width: 450px; background: #202024; padding: 25px; border-radius: 8px; border: 1px solid #323238; }
        h2 { text-align: center; color: #fff; margin-bottom: 20px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 8px; color: #a8a8a8; font-size: 14px; }
        input, select { width: 100%; padding: 12px; background: #121214; border: 1px solid #323238; border-radius: 6px; color: #fff; }
        .grade-horarios { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
        .btn-horario { background: #29292e; color: #fff; border: 1px solid #323238; padding: 10px; border-radius: 6px; cursor: pointer; text-align: center; }
        .btn-horario.selecionado { background: #ff9000; color: #121214; border-color: #ff9000; }
        .btn-confirmar { width: 100%; background: #ff9000; color: #121214; border: none; padding: 15px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container-agendamento">
    <!-- Texto fixo conforme solicitado -->
    <h2 id="nomeEstabelecimento">Agendar</h2>
    
    <form id="formAgendamento">
        <div class="form-group">
            <label>Seu Nome</label>
            <input type="text" id="nomeCliente" required>
        </div>
        <div class="form-group">
            <label>WhatsApp</label>
            <input type="tel" id="whatsappCliente" required>
        </div>
        <div class="form-group">
            <label>Profissional</label>
            <select id="profissionalSelecionado" required><option value="">Selecione...</option></select>
        </div>
        <div class="form-group">
            <label>Serviço</label>
            <select id="servicoSelecionado" required><option value="">Selecione...</option></select>
        </div>
        <div class="form-group">
            <label>Dia</label>
            <input type="date" id="dataAgendamento" required>
        </div>
        <div class="form-group">
            <label>Horários Disponíveis</label>
            <div class="grade-horarios" id="containerHorarios"></div>
        </div>
        <button type="submit" class="btn-confirmar">Confirmar Agendamento</button>
    </form>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    let idLoja = urlParams.get('id') || localStorage.getItem("idLojaAtual");
    if (idLoja) localStorage.setItem("idLojaAtual", idLoja);
    
    const db = window.db; 
    let horarioSelecionadoGlobal = null;

    // Carregar Profissionais
    db.collection("config_profissionais").where("estabelecimentoId", "==", idLoja).get().then(snap => {
        const select = document.getElementById("profissionalSelecionado");
        snap.forEach(doc => { select.innerHTML += `<option value="${doc.data().nome}">${doc.data().nome}</option>`; });
    });

    // Carregar Serviços
    db.collection("servicos").where("estabelecimentoId", "==", idLoja).get().then(snap => {
        const select = document.getElementById("servicoSelecionado");
        snap.forEach(doc => {
            const s = doc.data();
            if(s.ativo !== false) {
                select.innerHTML += `<option value="${s.nome}" data-tempo="${s.duracaoMinutos}">${s.nome} - R$ ${s.preco} (${s.duracaoMinutos} min)</option>`;
            }
        });
    });

    async function carregarHorarios() {
        const prof = document.getElementById("profissionalSelecionado").value;
        const data = document.getElementById("dataAgendamento").value;
        const selectServico = document.getElementById("servicoSelecionado");
        const duracao = parseInt(selectServico.selectedOptions[0]?.getAttribute("data-tempo") || 30);
        const container = document.getElementById("containerHorarios");

        if (!prof || !data) return;

        const dataFormatada = data.split("-").reverse().join("/");
        const snap = await db.collection("agenda_clientes").where("estabelecimentoId", "==", idLoja).get();
        const servicosSnap = await db.collection("servicos").where("estabelecimentoId", "==", idLoja).get();
        
        const mapaDuracao = {};
        servicosSnap.forEach(doc => mapaDuracao[doc.data().nome] = parseInt(doc.data().duracaoMinutos) || 30);

        let intervalosOcupados = [];
        snap.forEach(doc => {
            const d = doc.data();
            if(d.profissional === prof && d.dataFormatada === dataFormatada) {
                const [h, m] = d.horario.split(':').map(Number);
                const inicio = h * 60 + m;
                const fim = inicio + (mapaDuracao[d.servico] || 30);
                intervalosOcupados.push({ inicio, fim });
            }
        });

        container.innerHTML = "";

        for (let min = (9 * 60); min < (19 * 60); min += 5) { 
            let fimTentativo = min + duracao;
            let ocupado = intervalosOcupados.some(i => (min < i.fim && fimTentativo > i.inicio));
            
            if (!ocupado && fimTentativo <= (19 * 60)) {
                let hr = `${String(Math.floor(min / 60)).padStart(2, '0')}:${String(min % 60).padStart(2, '0')}`;
                const b = document.createElement("div");
                b.className = "btn-horario";
                b.innerText = hr;
                b.onclick = () => {
                    document.querySelectorAll(".btn-horario").forEach(i => i.classList.remove("selecionado"));
                    b.classList.add("selecionado");
                    horarioSelecionadoGlobal = hr;
                };
                container.appendChild(b);
                min += (duracao - 5); 
            }
        }
    }

    document.getElementById("dataAgendamento").addEventListener("change", carregarHorarios);
    document.getElementById("profissionalSelecionado").addEventListener("change", carregarHorarios);
    document.getElementById("servicoSelecionado").addEventListener("change", carregarHorarios);

    document.getElementById("formAgendamento").onsubmit = (e) => {
        e.preventDefault();
        if (!horarioSelecionadoGlobal) return alert("Escolha um horário!");
        
        db.collection("agenda_clientes").add({
            estabelecimentoId: idLoja,
            cliente: document.getElementById("nomeCliente").value,
            whatsapp: document.getElementById("whatsappCliente").value,
            profissional: document.getElementById("profissionalSelecionado").value,
            servico: document.getElementById("servicoSelecionado").value,
            horario: horarioSelecionadoGlobal,
            dataFormatada: document.getElementById("dataAgendamento").value.split("-").reverse().join("/"),
            status: "Aguardando"
        }).then(() => { 
            alert("Agendamento realizado com sucesso!"); 
            location.reload(); 
        }).catch(err => {
            console.error(err);
            alert("Erro ao agendar. Verifique as permissões do banco.");
        });
    };
</script>
</body>
</html>
